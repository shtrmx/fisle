services:
  fisle:
    image: ${DOCKERHUB_USER:-shtrmx}/fisle-game:${FISLE_VERSION:-latest}
    build:
      context: ./game
      dockerfile: Dockerfile
      args:
        VERSION: ${FISLE_VERSION:-latest}
    container_name: fisle
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MAX_ROOMS: ${MAX_ROOMS:-100}
      MAX_ROOMS_PER_PLAYER: ${MAX_ROOMS_PER_PLAYER:-3}
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-1.0}"
          memory: "${MEMORY_LIMIT:-512M}"
    restart: unless-stopped
    networks:
      - fisle-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  fisle-net:
    driver: bridge
